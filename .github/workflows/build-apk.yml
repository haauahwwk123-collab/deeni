name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PKG: ""
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack
        run: mkdir -p /tmp/pkg && echo "$PKG" | base64 -d | tar xz -C /tmp/pkg
      - name: Build
        run: bash /tmp/pkg/build.sh 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}
      - name: Show errors
        if: failure()
        run: |
          grep -i -E "error|FAILED|went wrong|cannot find|not found" /tmp/build.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
          tail -15 /tmp/build.log | while IFS= read -r l; do echo "::warning::${l:0:300}"; done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp /tmp/work/android/app/build/outputs/apk/debug/app-debug.apk /tmp/deeni.apk
          gh release delete apk-latest --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
          gh release create apk-latest /tmp/deeni.apk --repo "$GITHUB_REPOSITORY" --title "Deeni APK (test build)" --notes "Debug-signed test APK."
